<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de divisas — BCRA</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#ffffff; --bg2:#f5f5f3; --bg3:#eeede8;
      --tx:#1a1a1a; --tx2:#6b6b6b; --tx3:#9b9b9b;
      --bd:rgba(0,0,0,0.12); --bd2:rgba(0,0,0,0.25);
      --accent:#185FA5; --ok:#3B6D11; --err:#A32D2D;
      --r:8px; --rl:12px;
      --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#1e1e1e; --bg2:#2a2a2a; --bg3:#333333;
      --tx:#f0f0f0; --tx2:#a0a0a0; --tx3:#6b6b6b;
      --bd:rgba(255,255,255,0.1); --bd2:rgba(255,255,255,0.22);
      --accent:#85B7EB; --ok:#97C459; --err:#F09595;
    }}
    body { font-family:var(--font); background:var(--bg3); color:var(--tx); min-height:100vh; padding:2rem 1rem; }
    .container { max-width:760px; margin:0 auto; }
    header { margin-bottom:2rem; }
    header h1 { font-size:22px; font-weight:500; }
    header p  { font-size:14px; color:var(--tx2); margin-top:4px; }
    header a  { color:var(--accent); text-decoration:none; font-size:13px; display:inline-block; margin-top:6px; }
    .card { background:var(--bg); border:0.5px solid var(--bd); border-radius:var(--rl); padding:1.25rem; margin-bottom:1rem; }
    .slabel { font-size:11px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--tx2); margin-bottom:12px; }
    .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    .field { display:flex; flex-direction:column; gap:5px; flex:1; min-width:130px; }
    .field label { font-size:12px; color:var(--tx2); }
    input, select {
      height:36px; width:100%; background:var(--bg);
      border:0.5px solid var(--bd2); border-radius:var(--r);
      padding:0 10px; font-size:14px; color:var(--tx);
      font-family:var(--font); outline:none; transition:border-color .15s;
    }
    input:focus, select:focus { border-color:var(--accent); }
    .ibtn {
      background:var(--bg2); border:0.5px solid var(--bd2); border-radius:var(--r);
      width:36px; height:36px; cursor:pointer; display:flex; align-items:center;
      justify-content:center; font-size:17px; color:var(--tx);
      flex-shrink:0; align-self:flex-end; transition:background .1s;
    }
    .ibtn:hover { background:var(--bg3); }
    .pbtn {
      background:var(--bg); border:0.5px solid var(--bd2); border-radius:var(--r);
      padding:0 18px; height:36px; cursor:pointer; font-size:13px; font-weight:500;
      color:var(--tx); font-family:var(--font); transition:background .1s;
      white-space:nowrap; align-self:flex-end;
    }
    .pbtn:hover { background:var(--bg2); }
    .srow { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--tx2); margin-top:10px; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); flex-shrink:0; }
    .dot.loading { background:#BA7517; animation:pulse 1s ease-in-out infinite; }
    .dot.error { background:var(--err); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .ebox {
      font-size:12px; color:var(--err);
      background:color-mix(in srgb,var(--err) 10%,transparent);
      border-radius:var(--r); padding:8px 12px; margin-top:8px;
      border:0.5px solid color-mix(in srgb,var(--err) 30%,transparent);
    }
    .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:10px; margin-top:1rem; }
    .metric { background:var(--bg2); border-radius:var(--r); padding:1rem; }
    .metric-lbl { font-size:12px; color:var(--tx2); margin-bottom:6px; }
    .metric-val { font-size:20px; font-weight:500; color:var(--tx); word-break:break-all; }
    .metric-sub { font-size:11px; color:var(--tx3); margin-top:4px; }
    .prow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .pbtn2 {
      background:var(--bg2); border:0.5px solid var(--bd); border-radius:var(--r);
      padding:4px 10px; cursor:pointer; font-size:12px; color:var(--tx2);
      font-family:var(--font); transition:all .1s;
    }
    .pbtn2.active { background:var(--bg); border-color:var(--bd2); color:var(--tx); font-weight:500; }
    .chart-wrap { position:relative; width:100%; height:230px; margin-top:14px; }
    .hstats { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .hstats .metric { flex:1; min-width:100px; }
    .hstats .metric-val { font-size:16px; }
    .tup { color:var(--ok); } .tdn { color:var(--err); }
    .pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .pill {
      background:var(--bg2); border:0.5px solid var(--bd); border-radius:20px;
      padding:3px 10px; font-size:12px; display:flex; gap:5px; align-items:center;
    }
    .pill b { font-weight:500; color:var(--tx); }
    .pill span { color:var(--tx2); }
    footer { text-align:center; font-size:12px; color:var(--tx3); margin-top:1.5rem; padding-bottom:1rem; }
    footer a { color:var(--accent); text-decoration:none; }
    @media(max-width:520px){
      .row { flex-direction:column; align-items:stretch; }
      .ibtn, .pbtn { align-self:flex-start; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Conversor de divisas</h1>
    <p>Cotizaciones oficiales publicadas por el Banco Central de la República Argentina</p>
    <a href="https://www.bcra.gob.ar/apis-banco-central/" target="_blank" rel="noopener">API oficial BCRA ↗</a>
  </header>
 
  <div class="card">
    <div class="slabel">Conversión</div>
    <div class="row">
      <div class="field">
        <label for="amount">Monto</label>
        <input type="number" id="amount" value="1000" min="0" step="any">
      </div>
      <div class="field">
        <label for="from-cur">Origen</label>
        <select id="from-cur"></select>
      </div>
      <button class="ibtn" onclick="swap()" title="Invertir par" aria-label="Invertir monedas">⇄</button>
      <div class="field">
        <label for="to-cur">Destino</label>
        <select id="to-cur"></select>
      </div>
      <button class="pbtn" onclick="convert()">Convertir</button>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field" style="max-width:190px">
        <label for="date-input">Fecha de cotización</label>
        <input type="date" id="date-input">
      </div>
      <button class="pbtn" onclick="loadByDate()">Cargar fecha</button>
      <button class="pbtn" onclick="loadLatest()">Hoy</button>
    </div>
    <div class="srow">
      <span class="dot loading" id="sdot"></span>
      <span id="stxt">Cargando cotizaciones del BCRA...</span>
    </div>
    <div id="errbox" style="display:none" class="ebox" role="alert"></div>
    <div id="result-area" style="display:none">
      <div class="metrics" id="metrics-row"></div>
    </div>
  </div>
 
  <div class="card" id="hist-card" style="display:none">
    <div class="slabel" id="hist-title">Historial</div>
    <div class="prow">
      <span style="font-size:12px;color:var(--tx2)">Período:</span>
      <button class="pbtn2 active" onclick="setPeriod(7,this)">7 días</button>
      <button class="pbtn2" onclick="setPeriod(30,this)">30 días</button>
      <button class="pbtn2" onclick="setPeriod(90,this)">90 días</button>
      <button class="pbtn2" onclick="setPeriod(180,this)">180 días</button>
    </div>
    <div class="chart-wrap">
      <canvas id="hchart" role="img" aria-label="Historial del tipo de cambio seleccionado"></canvas>
    </div>
    <div class="hstats" id="hist-stats"></div>
  </div>
 
  <div class="card" id="all-rates-card" style="display:none">
    <div class="slabel">Todas las cotizaciones en USD</div>
    <div class="pills" id="all-pills"></div>
    <p style="font-size:11px;color:var(--tx3);margin-top:10px" id="rates-date-lbl"></p>
  </div>
 
  <footer>
    Datos: <a href="https://api.bcra.gob.ar" target="_blank" rel="noopener">api.bcra.gob.ar</a>
    · Estadísticas Cambiarias v1.0
  </footer>
</div>
 
<script>
  /* ── Configuración ───────────────────────────────────────────────── */
  const PROXY = 'https://bcra-proxy-dkqc.onrender.com';
 
  /* ── Nombres de monedas ──────────────────────────────────────────── */
  const NAMES = {
    ARS:'Peso argentino', USD:'Dólar EE.UU.', EUR:'Euro',
    BRL:'Real brasileño', GBP:'Libra esterlina', CHF:'Franco suizo',
    JPY:'Yen japonés', CNY:'Yuan CNY Renminbi', CNH:'Yuan CNH offshore',
    CAD:'Dólar canadiense', AUD:'Dólar australiano', MXP:'Peso mexicano',
    CLP:'Peso chileno', UYU:'Peso uruguayo', BOB:'Boliviano',
    PYG:'Guaraní', COP:'Colombianos', PEN:'Soles', CZK:'Coronas checas',
    DKK:'Coronas danesas', SEK:'Coronas suecas', NOK:'Coronas noruegas',
    HKD:'Dólar Hong Kong', SGD:'Dólar Singapur', NZD:'Dólar neozelandés',
    INR:'Rupia india', RUB:'Rusia', TRY:'Lira turca', ZAR:'Rand sudafricano',
    ILS:'Libra israelí', RSD:'Dinar Serbia', VND:'Dong Vietnam',
    AWG:'Florín Antillas', VEB:'Bolívares', NIO:'Córdoba nicaragüense',
    XAU:'Oro (onza troy)', XAG:'Plata (onza troy)', XDR:'DEG (FMI)',
    REF:'Dólar Ref. Com. A3500',
  };
 
  /* ── Estado ──────────────────────────────────────────────────────── */
  let rates = {}, pases = {}, rateDate = '', histChart = null, histDays = 7;
  let fromCur = 'USD', toCur = 'ARS';
 
  /* ── Utils ───────────────────────────────────────────────────────── */
  const fmt = (n, d) =>
    new Intl.NumberFormat('es-AR', { minimumFractionDigits:d, maximumFractionDigits:d }).format(n);
  const fmtDate = d => d.toISOString().slice(0, 10);
  const prec = v => v === 0 ? 2 : v < 0.001 ? 6 : v < 1 ? 4 : v < 1000 ? 2 : 0;
 
  function setStatus(st, msg) {
    document.getElementById('sdot').className =
      'dot' + (st==='loading' ? ' loading' : st==='error' ? ' error' : '');
    document.getElementById('stxt').textContent = msg;
  }
  function showErr(m) {
    const e = document.getElementById('errbox');
    e.textContent = m; e.style.display = 'block';
  }
  function hideErr() { document.getElementById('errbox').style.display = 'none'; }
 
  /* ── API ─────────────────────────────────────────────────────────── */
  async function apiFetch(path) {
    const r = await fetch(`${PROXY}${path}`, { headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }
 
  /* ── Procesar cotizaciones del día ───────────────────────────────── */
  // La API devuelve:
  // { status:200, results: { fecha, detalle: [{codigoMoneda, descripcion, tipoPase, tipoCotizacion}] } }
  // tipoCotizacion = ARS por unidad de moneda extranjera (el valor que necesitamos)
  // tipoPase = inverso (moneda extranjera por ARS)
  function processCotizaciones(data) {
    if (data.status !== 200 || !data.results) throw new Error('Respuesta inesperada');
    const { fecha, detalle } = data.results;
    const newRates = { ARS: 1 };
    const newPases = {};
    detalle.forEach(item => {
      const val = item.tipoCotizacion;
      if (item.codigoMoneda && val > 0) newRates[item.codigoMoneda] = val;
      if (item.codigoMoneda && item.tipoPase > 0) newPases[item.codigoMoneda] = item.tipoPase;
    });
    if (Object.keys(newRates).length < 2) throw new Error('Sin cotizaciones');
    rates = newRates;
    pases = newPases;
    rateDate = (fecha || '').slice(0, 10);
  }
 
  /* ── Combos ──────────────────────────────────────────────────────── */
  function populateCombos() {
    const order = ['USD', 'EUR', 'BRL', 'GBP', 'ARS'];
    const keys = Object.keys(rates).sort((a, b) => {
      const ai = order.indexOf(a), bi = order.indexOf(b);
      if (ai >= 0 && bi >= 0) return ai - bi;
      if (ai >= 0) return -1; if (bi >= 0) return 1;
      return a.localeCompare(b);
    });
    ['from-cur', 'to-cur'].forEach(id => {
      const s = document.getElementById(id), prev = s.value;
      s.innerHTML = '';
      keys.forEach(k => {
        const o = document.createElement('option');
        o.value = k;
        o.textContent = `${k}  ${NAMES[k] || ''}`;
        s.appendChild(o);
      });
      if (prev && rates[prev]) s.value = prev;
    });
    document.getElementById('from-cur').value = fromCur in rates ? fromCur : 'USD';
    document.getElementById('to-cur').value   = toCur   in rates ? toCur   : 'ARS';
  }
 
  /* ── Pills ───────────────────────────────────────────────────────── */
  // Divisas que ya traen tipoPase expresado como USD por unidad (se muestran directo)
  const PASE_DIRECTO = new Set(['EUR', 'GBP', 'CHF', 'XDR']);
  // Divisas excluidas del panel
  const EXCLUIDAS    = new Set(['REF']);

  function usdValue(codigo) {
    if (codigo === 'ARS') {
      // Mostrar ARS: cuántos pesos vale 1 USD (tipoCotizacion del USD)
      return { val: rates['USD'] || null, sufijo: 'ARS / USD' };
    }
    if (PASE_DIRECTO.has(codigo)) {
      // tipoPase ya es USD por unidad de la divisa
      const v = pases[codigo];
      return v ? { val: v, sufijo: 'USD' } : null;
    }
    // Resto: 1 / tipoPase
    const p = pases[codigo];
    return p ? { val: 1 / p, sufijo: 'USD' } : null;
  }

  function populatePills() {
    const g = document.getElementById('all-pills');
    g.innerHTML = '';

    const orden = ['ARS', 'EUR', 'GBP', 'CHF', 'BRL', 'UYU', 'CLP'];
    const todos  = Object.keys(rates)
      .filter(c => c !== 'USD' && !EXCLUIDAS.has(c))
      .sort((a, b) => {
        const ai = orden.indexOf(a), bi = orden.indexOf(b);
        if (ai >= 0 && bi >= 0) return ai - bi;
        if (ai >= 0) return -1;
        if (bi >= 0) return 1;
        return a.localeCompare(b);
      });

    todos.forEach(c => {
      const r = usdValue(c);
      if (!r) return;
      const decimales = r.val >= 100 ? 2 : r.val >= 1 ? 4 : 6;
      const p = document.createElement('div');
      p.className = 'pill';
      if (c === 'ARS') {
        p.innerHTML = `<b>${c}</b><span>${fmt(r.val, 2)} ${r.sufijo}</span>`;
      } else {
        p.innerHTML = `<b>${c}</b><span>${fmt(r.val, decimales)} ${r.sufijo}</span>`;
      }
      g.appendChild(p);
    });

    document.getElementById('rates-date-lbl').textContent = `Fecha: ${rateDate}`;
    document.getElementById('all-rates-card').style.display = 'block';
  }
 
  /* ── Conversión ──────────────────────────────────────────────────── */
  function convert() {
    const amount = parseFloat(document.getElementById('amount').value) || 0;
    fromCur = document.getElementById('from-cur').value;
    toCur   = document.getElementById('to-cur').value;
    if (!rates[fromCur] || !rates[toCur]) return;
 
    const inARS  = amount * rates[fromCur];
    const result = inARS / rates[toCur];
    const direct = rates[fromCur] / rates[toCur];
    const inv    = rates[toCur]   / rates[fromCur];
 
    document.getElementById('metrics-row').innerHTML = `
      <div class="metric">
        <div class="metric-lbl">Resultado</div>
        <div class="metric-val">${fmt(result, prec(result))} ${toCur}</div>
        <div class="metric-sub">${fmt(amount, 2)} ${fromCur} convertidos</div>
      </div>
      <div class="metric">
        <div class="metric-lbl">Tasa directa</div>
        <div class="metric-val">1 ${fromCur} = ${fmt(direct, prec(direct))} ${toCur}</div>
        <div class="metric-sub">Cotización al ${rateDate}</div>
      </div>
      <div class="metric">
        <div class="metric-lbl">Tasa inversa</div>
        <div class="metric-val">1 ${toCur} = ${fmt(inv, prec(inv))} ${fromCur}</div>
        <div class="metric-sub">Par invertido</div>
      </div>`;
    document.getElementById('result-area').style.display = 'block';
    loadHistorical();
  }
 
  /* ── Historial ───────────────────────────────────────────────────── */
  async function loadHistorical() {
    const from = document.getElementById('from-cur').value;
    const to   = document.getElementById('to-cur').value;
 
    // Elegimos la moneda no-ARS para consultar historial
    // Si ninguna es ARS, usamos "from" y calculamos el cruce vía ARS
    const moneda = from !== 'ARS' ? from : to;
    if (moneda === 'ARS') return;
 
    const end   = new Date();
    const start = new Date(); start.setDate(start.getDate() - histDays);
 
    setStatus('loading', 'Cargando historial...');
    try {
      const data = await apiFetch(
        `/historial/${moneda}?fechaDesde=${fmtDate(start)}&fechaHasta=${fmtDate(end)}&limit=365`
      );
 
      // Historial devuelve array de { fecha, detalle: [{codigoMoneda, tipoCotizacion, ...}] }
      const results = data.results || [];
      const points = results.map(entry => {
        const d = entry.detalle || [];
        const fromRate = from === 'ARS' ? 1
          : (d.find(x => x.codigoMoneda === from) || {}).tipoCotizacion;
        const toRate = to === 'ARS' ? 1
          : (d.find(x => x.codigoMoneda === to) || {}).tipoCotizacion;
        if (!fromRate || !toRate) return null;
        return { x: (entry.fecha || '').slice(0, 10), y: fromRate / toRate };
      }).filter(Boolean).sort((a, b) => a.x.localeCompare(b.x));
 
      if (!points.length) {
        setStatus('ok', `Datos al ${rateDate} · ${Object.keys(rates).length} monedas`);
        return;
      }
 
      renderChart(points, from, to);
 
      const vals = points.map(p => p.y);
      const minV = Math.min(...vals), maxV = Math.max(...vals);
      const chg  = (vals[vals.length-1] - vals[0]) / vals[0] * 100;
      const chgStr = (chg >= 0 ? '+' : '') + fmt(chg, 2) + '%';
      const p = prec(vals[vals.length-1]);
 
      document.getElementById('hist-stats').innerHTML = `
        <div class="metric" style="flex:1;min-width:100px">
          <div class="metric-lbl">Mínimo período</div>
          <div class="metric-val">${fmt(minV, p)}</div>
        </div>
        <div class="metric" style="flex:1;min-width:100px">
          <div class="metric-lbl">Máximo período</div>
          <div class="metric-val">${fmt(maxV, p)}</div>
        </div>
        <div class="metric" style="flex:1;min-width:100px">
          <div class="metric-lbl">Variación</div>
          <div class="metric-val ${chg >= 0 ? 'tup' : 'tdn'}">${chgStr}</div>
        </div>
        <div class="metric" style="flex:1;min-width:100px">
          <div class="metric-lbl">Último valor</div>
          <div class="metric-val">${fmt(vals[vals.length-1], p)}</div>
        </div>`;
 
      document.getElementById('hist-title').textContent =
        `Historial ${from}/${to} — últimos ${histDays} días`;
      document.getElementById('hist-card').style.display = 'block';
      setStatus('ok', `Datos al ${rateDate} · ${Object.keys(rates).length} monedas`);
    } catch(e) {
      setStatus('error', 'Error al cargar historial');
      showErr(`Error historial: ${e.message}`);
    }
  }
 
  function renderChart(points, from, to) {
    const dark  = matchMedia('(prefers-color-scheme:dark)').matches;
    const line  = dark ? '#85B7EB' : '#185FA5';
    const fill  = dark ? 'rgba(133,183,235,0.1)' : 'rgba(24,95,165,0.07)';
    const grid  = dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
    const label = dark ? 'rgba(255,255,255,0.4)'  : 'rgba(0,0,0,0.38)';
    const p = prec(points[0].y);
 
    if (histChart) { histChart.destroy(); histChart = null; }
    histChart = new Chart(
      document.getElementById('hchart').getContext('2d'), {
        type: 'line',
        data: {
          labels: points.map(pt => pt.x),
          datasets: [{
            label: `${from}/${to}`,
            data: points.map(pt => pt.y),
            borderColor: line, backgroundColor: fill, fill: true,
            borderWidth: 1.5,
            pointRadius: points.length > 30 ? 0 : 3,
            pointHoverRadius: 5, tension: 0.3,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: {
              label: ctx => `${fmt(ctx.parsed.y, p)} ${to}`,
              title: ctx => ctx[0].label,
            }}
          },
          scales: {
            x: { ticks: { color:label, maxTicksLimit:8, maxRotation:0, font:{size:11} }, grid: { color:grid } },
            y: { ticks: { color:label, font:{size:11}, callback: v => fmt(v, p) }, grid: { color:grid } },
          }
        }
      }
    );
  }
 
  /* ── Controles ───────────────────────────────────────────────────── */
  function swap() {
    const f = document.getElementById('from-cur');
    const t = document.getElementById('to-cur');
    [f.value, t.value] = [t.value, f.value];
    convert();
  }
 
  function setPeriod(days, btn) {
    histDays = days;
    document.querySelectorAll('.pbtn2').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadHistorical();
  }
 
  /* ── Carga de datos ──────────────────────────────────────────────── */
  function initDateInput() {
    const d = document.getElementById('date-input'), t = new Date();
    d.value = fmtDate(t); d.max = fmtDate(t);
  }
 
  async function loadLatest() {
    setStatus('loading', 'Consultando BCRA...'); hideErr(); initDateInput();
    try {
      const data = await apiFetch('/cotizaciones');
      processCotizaciones(data);
      populateCombos(); populatePills();
      setStatus('ok', `Datos al ${rateDate} · ${Object.keys(rates).length} monedas`);
      convert();
    } catch(e) {
      showErr(`Error al conectar con BCRA: ${e.message}`);
      setStatus('error', 'Error de conexión');
      loadFallback();
    }
  }
 
  async function loadByDate() {
    const d = document.getElementById('date-input').value;
    if (!d) return;
    setStatus('loading', `Consultando cotizaciones del ${d}...`); hideErr();
    try {
      const data = await apiFetch(`/cotizaciones?fecha=${d}`);
      processCotizaciones(data);
      populateCombos(); populatePills();
      setStatus('ok', `Datos al ${rateDate} · ${Object.keys(rates).length} monedas`);
      convert();
    } catch(e) {
      showErr(`Error: ${e.message}`); setStatus('error', 'Error');
    }
  }
 
  function loadFallback() {
    rates = {
      ARS:1, USD:1370, EUR:1605, BRL:272, GBP:1843,
      CHF:1735, JPY:8.6, CNY:200, CAD:990, AUD:969,
      UYU:34, CLP:1.5, COP:0.37, PEN:404,
    };
    // tipoPase aproximados (moneda extranjera por ARS)
    // EUR/GBP/CHF: tipoPase = USD por unidad (directo)
    // Resto: tipoPase = 1 / (cotización en USD) → se invierte en usdValue()
    pases = {
      EUR:1.172, GBP:1.346, CHF:1.267,
      BRL: 1/0.731,   // ~1.368 → 1/1.368 ≈ 0.731
      JPY: 1/145.8,
      CNY: 1/6.85,
      CAD: 1/1.383,
      AUD: 1/1.414,
      UYU: 1/40.3,
      CLP: 1/913,
      COP: 1/3700,
      PEN: 1/3.39,
    };
    rateDate = 'ejemplo (sin conexión)';
    populateCombos(); populatePills();
    setStatus('error', 'Usando datos de ejemplo — proxy no disponible');
    convert();
  }
 
  /* ── Init ────────────────────────────────────────────────────────── */
  initDateInput();
  loadLatest();
  document.getElementById('amount').addEventListener('input', () => {
    if (Object.keys(rates).length) convert();
  });
  document.getElementById('from-cur').addEventListener('change', convert);
  document.getElementById('to-cur').addEventListener('change', convert);
</script>
